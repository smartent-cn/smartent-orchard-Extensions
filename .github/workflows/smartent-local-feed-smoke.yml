name: Smartent Local Feed Smoke

# Core pack + verify；不跑 -Full pack。手动或 dev 上 scripts 变更时触发。
on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - scripts/Pack-SmartentLocalFeed.ps1
      - scripts/Verify-SmartentLocalFeed.ps1
      - scripts/Test-NuGetVerifyCorePackageRestore.ps1

jobs:
  feed-smoke:
    name: Pack, verify, and core NuGetVerify restore
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack and verify local feed
        shell: pwsh
        run: ./scripts/Pack-SmartentLocalFeed.ps1

      - name: Standalone PackageReference restore smoke
        shell: pwsh
        run: ./scripts/Test-NuGetVerifyCorePackageRestore.ps1 -SkipPack