name: Smartent Local Feed Smoke

# Core pack → M7 聚合门禁；不跑 -Full pack。
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
    paths:
      - scripts/Pack-SmartentLocalFeed.ps1
      - scripts/Verify-SmartentLocalFeed.ps1
      - scripts/Test-NuGetVerifyCorePackageRestore.ps1
      - scripts/Invoke-M7CoreFeedGate.ps1
      - scripts/Invoke-M7FullNuGetVerifyGate.ps1
      - scripts/feed-core-pack-versions.ps1
      - scripts/Assert-FeedCorePackVersions.ps1
      - NuGetVerify/Directory.Packages.props

jobs:
  feed-smoke:
    name: M7 core feed gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Invoke M7 core feed gate
        shell: pwsh
        run: ./scripts/Invoke-M7CoreFeedGate.ps1